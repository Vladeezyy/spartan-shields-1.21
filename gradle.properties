org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Project
mod_id=spartanshields
mod_name=Spartan Shields
license=LGPL-3.0-only
mod_version=3.1.1.4
group=com.oblivioussp.spartanshields
mod_authors=ObliviousSpartan
java_version=21

# Common
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
# NeoForm (vanilla Minecraft for the common project) and ParchmentMC
neo_form_version=1.21.11-20251209.172050

# NeoForge
neo_version=21.11.48
# The oldest NeoForge the jar runs on
neo_version_range=[21.11.48,)

# Fabric
fabric_version=0.141.6+1.21.11
fabric_loader_version=0.19.5
# NeoForge's config API on Fabric (Forge Config API Port by Fuzs); the common project compiles against its API jar
forgeconfigapiport_version=21.11.1
# Energy of the powered shields on Fabric (Team Reborn Energy, 1 E = 1 FE)
team_reborn_energy_version=4.2.0

# Optional mods for NeoForge dev runs only (./gradlew :neoforge:runClient -Pwith_mods): the recipes and energy
# charging of the Mekanism and Ender IO shields. The jar does not depend on them.
# Compatibility runs only (-Pwith_compat)
compat_sodium=mc1.21.11-0.8.14-neoforge
compat_iris=1.10.8+1.21.11-neoforge
compat_lithium=mc1.21.11-0.21.4-neoforge
compat_ferritecore=8.2.0-neoforge
compat_jade=21.1.7+neoforge
compat_jei=27.48.0.106
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene / runStress; Modrinth version ids where a number is
# shared with other loaders)
compat_fabric_sodium=mc1.21.11-0.8.14-fabric
compat_fabric_iris=1.10.8+1.21.11-fabric
compat_fabric_lithium=mc1.21.11-0.21.4-fabric
compat_fabric_ferritecore=8.2.0-fabric
compat_fabric_jade=21.1.6+fabric
