org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 26.x: Gradle itself on JDK 25 (CI removes this line and sets up JDK 25)
org.gradle.java.home=/Users/vladeezy/.gradle/jdks/eclipse_adoptium-25-aarch64-os_x.2/jdk-25.0.4.1+1/Contents/Home

# Project
mod_id=spartanshields
mod_name=Spartan Shields
license=LGPL-3.0-only
mod_version=3.1.1.5
group=com.oblivioussp.spartanshields
mod_authors=ObliviousSpartan
java_version=25

# Common
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForm (vanilla Minecraft for the common project); 26.x has no obfuscation and no Parchment
neo_form_version=26.1.2-1

# NeoForge
neo_version=26.1.2.122
# The oldest NeoForge the jar runs on
neo_version_range=[26.1.2.122,)

# Fabric
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5
# NeoForge's config API on Fabric (Forge Config API Port by Fuzs); the common project compiles against its API jar
forgeconfigapiport_version=26.1.5
# Energy of the powered shields on Fabric (Team Reborn Energy, 1 E = 1 FE)
team_reborn_energy_version=5.0.0

# Optional mods for NeoForge dev runs only (./gradlew :neoforge:runClient -Pwith_mods): the recipes and energy
# charging of the Mekanism and Ender IO shields. The jar does not depend on them.
# Compatibility runs only (-Pwith_compat)
compat_sodium=mc26.1.2-0.9.2-neoforge
compat_iris=1.11.4+26.1-neoforge
compat_lithium=mc26.1.2-0.24.7-neoforge
compat_ferritecore=9.0.0-neoforge
compat_jade=26.1.12+neoforge
compat_jei=29.47.0.111
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene / runStress; Modrinth version ids where a number is
# shared with other loaders)
compat_fabric_sodium=mc26.1.2-0.9.2-fabric
compat_fabric_iris=1.11.4+26.1-fabric
compat_fabric_lithium=mc26.1.2-0.24.7-fabric
compat_fabric_ferritecore=9.0.0-fabric
compat_fabric_jade=26.1.11+fabric
