plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://modmaven.dev/' } // Mekanism (dev runs only)
    maven { url = 'https://maven.rover656.dev/releases' } // Ender IO (dev runs only)
    maven { url = 'https://maven.blamejared.com/' } // JEI (compatibility runs only)
}

neoForge {
    version = neo_version
    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        // Scripted test scene (port/DevScene): run/screenshots/scene_*.png, then quits
        scene {
            client()
            systemProperty 'spartanshields.scene', 'true'
        }
        // Functional and stress tests (port/StressScene)
        stress {
            client()
            systemProperty 'spartanshields.stress', 'true'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Mekanism and Ender IO have no 1.21.11 version: their shields stay off (as without those mods on 1.21.1)
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:${compat_sodium}"
        localRuntime "maven.modrinth:iris:${compat_iris}"
        localRuntime "maven.modrinth:lithium:${compat_lithium}"
        localRuntime "maven.modrinth:ferrite-core:${compat_ferritecore}"
        localRuntime "maven.modrinth:jade:${compat_jade}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${compat_jei}"
    }
}

// neoforge.mods.toml comes from src/main/templates with the gradle properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    // The test scenes (port/) are for dev runs only
    exclude 'com/oblivioussp/spartanshields/port/**'
}
