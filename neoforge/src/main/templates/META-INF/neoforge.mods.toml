modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Vladeezyy/spartan-shields-1.21/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/spartan-shields"
bannerFile="logo.png"
authors="${mod_authors}"
credits="Evinsta for the name. Port to NeoForge ${minecraft_version}: Vladeezyy"
description='''
Spartan Shields adds a variety of new shields to Minecraft.
'''

[[mixins]]
config="spartanshields.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
